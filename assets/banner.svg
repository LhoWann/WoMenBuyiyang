<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#151a3d"/>
      <stop offset="1" stop-color="#2a1b4f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>

  <text x="72" y="88" font-size="15" font-weight="600" letter-spacing="3" fill="#a5b4fc">STACK 2026 · CASE 1: SMARTER CAMPUS AND LEARNING</text>
  <text x="68" y="188" font-size="112" font-weight="800" letter-spacing="4" fill="#ffffff">SAPA</text>
  <rect x="74" y="206" width="72" height="5" rx="2.5" fill="#f59e0b"/>
  <text x="72" y="248" font-size="24" font-weight="600" fill="#e2e8f0">Know where every student got lost.</text>
  <text x="72" y="280" font-size="16" fill="#94a3b8">Anonymous questions · quizzes from your own code · help sessions with context</text>

  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M972 101 H998"/>
    <path d="M1102 134 V188"/>
    <path d="M998 221 H972"/>
    <path d="M868 188 V134"/>
  </g>

  <g>
    <rect x="766" y="70" width="204" height="62" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="796" cy="101" r="15" fill="#2dd4bf"/>
    <text x="796" y="107" font-size="16" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
    <text x="822" y="98" font-size="20" font-weight="700" fill="#ffffff">Learn</text>
    <text x="822" y="119" font-size="12.5" fill="#cbd5e1">ask, or tap "I'm lost"</text>
  </g>
  <g>
    <rect x="1000" y="70" width="204" height="62" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="1030" cy="101" r="15" fill="#f59e0b"/>
    <text x="1030" y="107" font-size="16" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
    <text x="1056" y="98" font-size="20" font-weight="700" fill="#ffffff">Check</text>
    <text x="1056" y="119" font-size="12.5" fill="#cbd5e1">quiz on your own code</text>
  </g>
  <g>
    <rect x="1000" y="190" width="204" height="62" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#fb7185" stroke-width="2"/>
    <circle cx="1030" cy="221" r="15" fill="#fb7185"/>
    <text x="1030" y="227" font-size="16" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
    <text x="1056" y="218" font-size="20" font-weight="700" fill="#ffffff">Assist</text>
    <text x="1056" y="239" font-size="12.5" fill="#cbd5e1">help that knows the gap</text>
  </g>
  <g>
    <rect x="766" y="190" width="204" height="62" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="796" cy="221" r="15" fill="#a78bfa"/>
    <text x="796" y="227" font-size="16" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
    <text x="822" y="218" font-size="20" font-weight="700" fill="#ffffff">Recap</text>
    <text x="822" y="239" font-size="12.5" fill="#cbd5e1">the most-lost slides</text>
  </g>

  <text x="1204" y="292" font-size="13" fill="#64748b" text-anchor="end">wǒ men bù yì yàng · Telkom University</text>
</svg>